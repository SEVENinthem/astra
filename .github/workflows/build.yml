name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (gtk3 for the file dialog)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp target/release/astra dist/
          cp -r assets README.md LICENSE install.sh dist/
          tar -czf "astra-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C dist .

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: astra-*-x86_64-linux.tar.gz
